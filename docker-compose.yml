version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: factory_admin
      POSTGRES_PASSWORD: factory_password
      POSTGRES_DB: factoryiq
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_admin -d factoryiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
